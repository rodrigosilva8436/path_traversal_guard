[project]
name = "path-traversal-guard"
version = "0.1.0"
description = "Validates that a resolved path stays within an allowed base directory, blocking directory traversal escapes."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
